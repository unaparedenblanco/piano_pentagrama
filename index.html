<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano & Pentagrama Interactiu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      min-height: 100dvh;
      width: 100vw;
      font-family: 'Outfit', sans-serif;
    }

    /* Permet scroll si la pantalla és excessivament petita/curta */
    body {
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Key Styling & Dynamic Response */
    .tecla-blanca {
      background: linear-gradient(to bottom, #ffffff 0%, #cbd5e1 100%);
      border: 1px solid #94a3b8;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.15), 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: background 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease;
      flex: 1 1 0%;
      height: 100%;
      min-width: 0;
    }

    .tecla-blanca:active, .tecla-blanca.activa {
      transform: translateY(3px);
      box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.2), 0 2px 3px rgba(0, 0, 0, 0.4) !important;
    }

    .tecla-negra {
      background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
      border: 1px solid #1e293b;
      border-radius: 0 0 6px 6px;
      box-shadow: inset 0 -3px 5px rgba(255, 255, 255, 0.1), 0 5px 8px rgba(0, 0, 0, 0.7);
      transition: background 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease;
      width: 8%;
      height: 60%;
      z-index: 20;
    }

    .tecla-negra:active, .tecla-negra.activa {
      background: linear-gradient(to bottom, #6366f1 0%, #4338ca 100%) !important;
      transform: translateY(3px);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.8), inset 0 -1px 3px rgba(255, 255, 255, 0.3) !important;
    }

    /* Key Active Color Highlights by Pitch */
    .tecla-blanca.activa[data-note^="C"] { background: linear-gradient(to bottom, #fecdd3, #f43f5e) !important; color: white; }
    .tecla-blanca.activa[data-note^="D"] { background: linear-gradient(to bottom, #fed7aa, #f97316) !important; color: white; }
    .tecla-blanca.activa[data-note^="E"] { background: linear-gradient(to bottom, #fef08a, #eab308) !important; color: black; }
    .tecla-blanca.activa[data-note^="F"] { background: linear-gradient(to bottom, #bbf7d0, #22c55e) !important; color: white; }
    .tecla-blanca.activa[data-note^="G"] { background: linear-gradient(to bottom, #a5f3fc, #06b6d4) !important; color: white; }
    .tecla-blanca.activa[data-note^="A"] { background: linear-gradient(to bottom, #bfdbfe, #3b82f6) !important; color: white; }
    .tecla-blanca.activa[data-note^="B"] { background: linear-gradient(to bottom, #ddd6fe, #8b5cf6) !important; color: white; }

    /* Pentagram animations */
    #cap-nota {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.12s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col justify-between min-h-dvh h-dvh w-screen p-2 sm:p-3 select-none">

  <!-- TOP HEADER & CONTROLS TOOLBAR (UNIFIED COMPACT BAR) -->
  <header class="w-full max-w-5xl mx-auto bg-slate-900/90 border border-slate-800 rounded-xl p-2 shadow-xl backdrop-blur-md flex flex-wrap items-center justify-between gap-2 shrink-0">
    
    <!-- Title & Author Tag -->
    <div class="flex items-center gap-2">
      <div class="h-7 w-7 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-sm text-white shadow-md">
        𝄞
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-extrabold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 leading-none">
          PIANO & PENTAGRAMA
        </h1>
        <p class="text-[9px] text-slate-400 font-medium tracking-tight">Per Miquel Castellá Viciano</p>
      </div>
    </div>

    <!-- Mode Toggle Switcher -->
    <div class="flex items-center bg-slate-950 p-0.5 rounded-lg border border-slate-800">
      <button id="btn-mode-free" class="px-2 py-1 rounded-md text-[10px] sm:text-xs font-semibold bg-indigo-600 text-white shadow-sm transition-all">
        Modus Lliure
      </button>
      <button id="btn-mode-game" class="px-2 py-1 rounded-md text-[10px] sm:text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all">
        Joc d'Entrenament
      </button>
    </div>

    <!-- Toolbar Settings Options -->
    <div class="flex items-center gap-2 text-xs">
      
      <!-- Notation Picker -->
      <div class="flex items-center gap-1">
        <span class="text-slate-400 text-[10px] font-medium hidden sm:inline">Notació:</span>
        <select id="select-notation" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-1.5 py-0.5 text-[10px] sm:text-xs focus:outline-none focus:border-indigo-500 cursor-pointer">
          <option value="solfeggio">Solfeig (Do, Re, Mi)</option>
          <option value="english">Anglosaxona (C, D, E)</option>
          <option value="both">Ambdós</option>
        </select>
      </div>

      <!-- Timbre Picker -->
      <div class="flex items-center gap-1">
        <span class="text-slate-400 text-[10px] font-medium hidden sm:inline">So:</span>
        <select id="select-wave" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-1.5 py-0.5 text-[10px] sm:text-xs focus:outline-none focus:border-indigo-500 cursor-pointer">
          <option value="piano">Piano</option>
          <option value="sine">Sintetitzador (Sinusoïdal)</option>
          <option value="organ">Òrgan</option>
        </select>
      </div>

      <!-- Volume Slider -->
      <div class="flex items-center gap-1 bg-slate-800/60 px-1.5 py-0.5 rounded-lg border border-slate-700/60">
        <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M11 5L6 9H2v6h4l5 4V5z"></path></svg>
        <input id="slider-volume" type="range" min="0" max="1" step="0.05" value="0.5" class="w-10 sm:w-14 accent-indigo-500 cursor-pointer h-1.5">
      </div>
    </div>
  </header>

  <!-- PENTAGRAM DISPLAY & GAME BAR CONTAINER -->
  <section class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center my-1 sm:my-2 px-1 gap-1.5 flex-1 min-h-[140px]">
    
    <!-- Game Score Banner (Visible only in game mode) -->
    <div id="game-scoreboard" class="hidden w-full max-w-xl bg-indigo-950/60 border border-indigo-500/40 px-3 py-1 rounded-lg flex items-center justify-between text-xs animate-fade-in shrink-0">
      <div class="flex items-center gap-3">
        <div>
          <span class="text-[9px] text-indigo-300 uppercase font-semibold block leading-tight">Punts</span>
          <span id="score-val" class="text-xs sm:text-sm font-extrabold text-white">0</span>
        </div>
        <div class="h-5 w-px bg-indigo-500/30"></div>
        <div>
          <span class="text-[9px] text-indigo-300 uppercase font-semibold block leading-tight">Ratxa</span>
          <span id="streak-val" class="text-xs sm:text-sm font-extrabold text-amber-400">0 🔥</span>
        </div>
      </div>
      <div id="game-feedback" class="font-bold text-indigo-200 text-right text-xs">
        Encerta quina nota sona al pentagrama!
      </div>
    </div>

    <!-- Pentagram Canvas SVG Container -->
    <div class="w-full max-w-xl bg-slate-900/90 border border-slate-800 rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center relative shadow-xl flex-1 min-h-[120px] max-h-[220px]">
      
      <svg width="100%" height="100%" viewBox="0 0 450 135" id="svg-pentagrama" class="w-full h-full max-h-full">
        <!-- Staff Lines (E4=85, G4=73, B4=61, D5=49, F5=37 - Step: 12px) -->
        <line x1="30" y1="37" x2="420" y2="37" stroke="#475569" stroke-width="1.5" />
        <line x1="30" y1="49" x2="420" y2="49" stroke="#475569" stroke-width="1.5" />
        <line x1="30" y1="61" x2="420" y2="61" stroke="#475569" stroke-width="1.5" />
        <line x1="30" y1="73" x2="420" y2="73" stroke="#475569" stroke-width="1.5" />
        <line x1="30" y1="85" x2="420" y2="85" stroke="#475569" stroke-width="1.5" />
        
        <!-- Treble Clef Symbol -->
        <text x="35" y="86" font-size="62" fill="#cbd5e1" style="font-family: serif; pointer-events: none;">𝄞</text>

        <!-- Interactive Note Group -->
        <g id="cap-nota" opacity="0">
          <!-- C4 Ledger Line -->
          <line id="linea-extra" x1="205" y1="97" x2="245" y2="97" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" style="display:none;" />
          
          <!-- Sharp (#) Symbol -->
          <text id="accident-nota" x="198" y="97" font-size="22" font-weight="bold" fill="#38bdf8" style="display:none; font-family: sans-serif;">♯</text>
          
          <!-- Notehead -->
          <ellipse id="oval-nota" cx="225" cy="85" rx="8" ry="6" transform="rotate(-20, 225, 85)" fill="#38bdf8" />
          
          <!-- Stem (Plica) -->
          <line id="plica-nota" x1="232" y1="85" x2="232" y2="53" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        </g>
        
        <!-- Note Name Label Text -->
        <text id="label-nota" x="225" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#818cf8" letter-spacing="0.5">Toca una tecla</text>
      </svg>
    </div>
  </section>

  <!-- PIANO KEYBOARD SECTION (Fluid & Height-Managed) -->
  <footer class="w-full max-w-3xl mx-auto flex flex-col items-center shrink-0 h-[26vh] max-h-[190px] min-h-[110px] mb-1">
    <div id="teclado" class="relative flex w-full h-full bg-slate-950 p-1.5 rounded-xl border border-slate-800 shadow-2xl">
      
      <!-- WHITE KEYS -->
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="C4" data-key="a">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(A)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">DO</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="D4" data-key="s">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(S)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">RE</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="E4" data-key="d">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(D)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">MI</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="F4" data-key="f">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(F)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">FA</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="G4" data-key="g">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(G)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">SOL</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="A4" data-key="h">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(H)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">LA</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="B4" data-key="j">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(J)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">SI</span>
      </button>
      <button class="tecla tecla-blanca relative flex flex-col justify-end items-center pb-1.5 text-slate-800 font-bold" data-note="C5" data-key="k">
        <span class="text-[8px] sm:text-[9px] text-slate-400 font-mono mb-0.5">(K)</span>
        <span class="label-nom text-[9px] sm:text-xs tracking-tight">DO</span>
      </button>

      <!-- BLACK KEYS (SHARPS) - Positioned dynamically with percentages -->
      <button class="tecla tecla-negra absolute left-[8.8%] flex flex-col justify-end items-center pb-1 text-slate-200 font-bold text-xs" data-note="Cs4" data-key="w">
        <span class="text-[7px] sm:text-[8px] text-indigo-300 font-mono mb-0.5">(W)</span>
        <span class="label-nom text-[8px] sm:text-[9px]">DO♯</span>
      </button>
      <button class="tecla tecla-negra absolute left-[21.3%] flex flex-col justify-end items-center pb-1 text-slate-200 font-bold text-xs" data-note="Ds4" data-key="e">
        <span class="text-[7px] sm:text-[8px] text-indigo-300 font-mono mb-0.5">(E)</span>
        <span class="label-nom text-[8px] sm:text-[9px]">RE♯</span>
      </button>
      
      <button class="tecla tecla-negra absolute left-[46.3%] flex flex-col justify-end items-center pb-1 text-slate-200 font-bold text-xs" data-note="Fs4" data-key="t">
        <span class="text-[7px] sm:text-[8px] text-indigo-300 font-mono mb-0.5">(T)</span>
        <span class="label-nom text-[8px] sm:text-[9px]">FA♯</span>
      </button>
      <button class="tecla tecla-negra absolute left-[58.8%] flex flex-col justify-end items-center pb-1 text-slate-200 font-bold text-xs" data-note="Gs4" data-key="y">
        <span class="text-[7px] sm:text-[8px] text-indigo-300 font-mono mb-0.5">(Y)</span>
        <span class="label-nom text-[8px] sm:text-[9px]">SOL♯</span>
      </button>
      <button class="tecla tecla-negra absolute left-[71.3%] flex flex-col justify-end items-center pb-1 text-slate-200 font-bold text-xs" data-note="As4" data-key="u">
        <span class="text-[7px] sm:text-[8px] text-indigo-300 font-mono mb-0.5">(U)</span>
        <span class="label-nom text-[8px] sm:text-[9px]">LA♯</span>
      </button>

    </div>
  </footer>

  <!-- SCRIPT APPLICATION LOGIC -->
  <script>
    (function() {
      // Audio & Application State
      let audioCtx = null;
      let masterGainNode = null;
      let currentMode = 'free'; // 'free' or 'game'
      let targetGameNote = null;
      let gameScore = 0;
      let gameStreak = 0;

      // Staff Y coordinates (E4=85, G4=73, B4=61, D5=49, F5=37 - Step size: 6px per semitone/diatonic step)
      const datosNotas = {
        "C4":  { f: 261.63, y: 97, solfeggio: "DO",  english: "C4",  sharp: false },
        "Cs4": { f: 277.18, y: 97, solfeggio: "DO♯", english: "C♯4", sharp: true },
        "D4":  { f: 293.66, y: 91, solfeggio: "RE",  english: "D4",  sharp: false },
        "Ds4": { f: 311.13, y: 91, solfeggio: "RE♯", english: "D♯4", sharp: true },
        "E4":  { f: 329.63, y: 85, solfeggio: "MI",  english: "E4",  sharp: false },
        "F4":  { f: 349.23, y: 79, solfeggio: "FA",  english: "F4",  sharp: false },
        "Fs4": { f: 369.99, y: 79, solfeggio: "FA♯", english: "F♯4", sharp: true },
        "G4":  { f: 392.00, y: 73, solfeggio: "SOL", english: "G4",  sharp: false },
        "Gs4": { f: 415.30, y: 73, solfeggio: "SOL♯",english: "G♯4", sharp: true },
        "A4":  { f: 440.00, y: 67, solfeggio: "LA",  english: "A4",  sharp: false },
        "As4": { f: 466.16, y: 67, solfeggio: "LA♯", english: "A♯4", sharp: true },
        "B4":  { f: 493.88, y: 61, solfeggio: "SI",  english: "B4",  sharp: false },
        "C5":  { f: 523.25, y: 55, solfeggio: "DO",  english: "C5",  sharp: false }
      };

      // DOM Elements
      const tecles = document.querySelectorAll('.tecla');
      const gNota = document.getElementById('cap-nota');
      const oval = document.getElementById('oval-nota');
      const plica = document.getElementById('plica-nota');
      const extra = document.getElementById('linea-extra');
      const accident = document.getElementById('accident-nota');
      const label = document.getElementById('label-nota');
      
      const btnFree = document.getElementById('btn-mode-free');
      const btnGame = document.getElementById('btn-mode-game');
      const gameScoreboard = document.getElementById('game-scoreboard');
      const scoreVal = document.getElementById('score-val');
      const streakVal = document.getElementById('streak-val');
      const gameFeedback = document.getElementById('game-feedback');
      
      const selectNotation = document.getElementById('select-notation');
      const selectWave = document.getElementById('select-wave');
      const sliderVolume = document.getElementById('slider-volume');

      const mapaTeclat = {};
      tecles.forEach(t => mapaTeclat[t.dataset.key] = t);

      // Web Audio Context Initialization
      function initAudio() {
        if (!audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtxClass();
          masterGainNode = audioCtx.createGain();
          masterGainNode.gain.setValueAtTime(parseFloat(sliderVolume.value), audioCtx.currentTime);
          masterGainNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // Audio Timbre Generator
      function crearOscil·lador(freq, waveType) {
        if (waveType === 'piano') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, audioCtx.currentTime);

          const mixGain = audioCtx.createGain();
          osc1.connect(mixGain);
          
          osc2.connect(subGain);
          subGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          subGain.connect(mixGain);

          return { main: mixGain, start: () => { osc1.start(); osc2.start(); }, stop: () => { osc1.stop(); osc2.stop(); } };
        } else if (waveType === 'organ') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          osc1.type = 'sawtooth';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
          osc2.frequency.setValueAtTime(freq * 0.5, audioCtx.currentTime);

          const mixGain = audioCtx.createGain();
          osc1.connect(mixGain);
          osc2.connect(mixGain);
          return { main: mixGain, start: () => { osc1.start(); osc2.start(); }, stop: () => { osc1.stop(); osc2.stop(); } };
        } else {
          const osc = audioCtx.createOscillator();
          osc.type = waveType;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          return { main: osc, start: () => osc.start(), stop: () => osc.stop() };
        }
      }

      // Play Sound Node Trigger
      function reproduirNota(teclaElement) {
        if (!teclaElement || teclaElement.dataset.playing) return;
        initAudio();

        const noteKey = teclaElement.dataset.note;
        const info = datosNotas[noteKey];

        const waveType = selectWave.value;
        const synth = crearOscil·lador(info.f, waveType);
        const noteGain = audioCtx.createGain();

        // Attack & Decay ADSR
        const now = audioCtx.currentTime;
        noteGain.gain.setValueAtTime(0, now);
        noteGain.gain.linearRampToValueAtTime(0.8, now + 0.02);
        noteGain.gain.exponentialRampToValueAtTime(0.5, now + 0.18);

        synth.main.connect(noteGain);
        noteGain.connect(masterGainNode);
        synth.start();

        teclaElement._synth = synth;
        teclaElement._noteGain = noteGain;
        teclaElement.dataset.playing = "true";

        teclaElement.classList.add('activa');

        if (currentMode === 'free') {
          actualitzarPentagrama(info, getFormattedNoteName(info));
        } else if (currentMode === 'game') {
          verificarRespostaJoc(noteKey);
        }
      }

      // Stop Sound Node (Graceful Release)
      function aturarNota(teclaElement) {
        if (!teclaElement || !teclaElement.dataset.playing) return;

        delete teclaElement.dataset.playing;
        teclaElement.classList.remove('activa');

        if (teclaElement._noteGain && audioCtx) {
          const now = audioCtx.currentTime;
          teclaElement._noteGain.gain.cancelScheduledValues(now);
          teclaElement._noteGain.gain.setValueAtTime(teclaElement._noteGain.gain.value, now);
          teclaElement._noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

          const synthToStop = teclaElement._synth;
          setTimeout(() => {
            try { synthToStop.stop(); } catch(e) {}
          }, 130);
        }
      }

      // Update Pentagram Visual Render
      function actualitzarPentagrama(info, labelText) {
        gNota.style.opacity = '1';
        label.textContent = labelText;

        oval.setAttribute('cy', info.y);
        oval.setAttribute('transform', `rotate(-20, 225, ${info.y})`);

        // Stem Direction (Plica): Middle line B4 (y <= 61) stem DOWN, below B4 stem UP
        if (info.y <= 61) {
          plica.setAttribute('x1', '218');
          plica.setAttribute('y1', info.y);
          plica.setAttribute('x2', '218');
          plica.setAttribute('y2', info.y + 32);
        } else {
          plica.setAttribute('x1', '232');
          plica.setAttribute('y1', info.y);
          plica.setAttribute('x2', '232');
          plica.setAttribute('y2', info.y - 32);
        }

        // Accidental Sharp (#) placement
        if (info.sharp) {
          accident.style.display = 'block';
          accident.setAttribute('y', info.y + 7);
        } else {
          accident.style.display = 'none';
        }

        // Ledger Line for C4 (y >= 97)
        if (info.y >= 97) {
          extra.style.display = 'block';
          extra.setAttribute('y1', info.y);
          extra.setAttribute('y2', info.y);
        } else {
          extra.style.display = 'none';
        }
      }

      function getFormattedNoteName(info) {
        const mode = selectNotation.value;
        if (mode === 'solfeggio') return info.solfeggio;
        if (mode === 'english') return info.english;
        return `${info.solfeggio} (${info.english})`;
      }

      function actualitzarEtiquetesTecles() {
        tecles.forEach(t => {
          const info = datosNotas[t.dataset.note];
          const labelSpan = t.querySelector('.label-nom');
          if (labelSpan && info) {
            labelSpan.textContent = getFormattedNoteName(info);
          }
        });
        if (gNota.style.opacity === '1' && currentMode === 'free') {
          const activeNoteKey = document.querySelector('.tecla.activa')?.dataset.note;
          if (activeNoteKey) {
            label.textContent = getFormattedNoteName(datosNotas[activeNoteKey]);
          }
        }
      }

      // Game Logic Switchers & Challenge
      function iniciarModeJoc() {
        currentMode = 'game';
        btnGame.className = "px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm transition-all";
        btnFree.className = "px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all";
        
        gameScoreboard.classList.remove('hidden');
        gameScore = 0;
        gameStreak = 0;
        scoreVal.textContent = gameScore;
        streakVal.textContent = "0 🔥";
        gameFeedback.textContent = "Encerta quina nota sona al pentagrama!";
        gameFeedback.className = "font-bold text-indigo-200 text-right";

        generarNovaNotaJoc();
      }

      function iniciarModeLliure() {
        currentMode = 'free';
        btnFree.className = "px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm transition-all";
        btnGame.className = "px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all";

        gameScoreboard.classList.add('hidden');
        label.textContent = "Toca una tecla";
        gNota.style.opacity = '0';
      }

      function generarNovaNotaJoc() {
        const noteKeys = Object.keys(datosNotas);
        const randomIndex = Math.floor(Math.random() * noteKeys.length);
        targetGameNote = noteKeys[randomIndex];
        const info = datosNotas[targetGameNote];

        actualitzarPentagrama(info, "???");
      }

      function verificarRespostaJoc(noteKey) {
        if (!targetGameNote) return;

        if (noteKey === targetGameNote) {
          gameScore += 10 + (gameStreak * 2);
          gameStreak++;
          scoreVal.textContent = gameScore;
          streakVal.textContent = `${gameStreak} 🔥`;
          
          gameFeedback.textContent = "Molt bé! ✨";
          gameFeedback.className = "font-bold text-emerald-400 text-right";

          setTimeout(() => {
            generarNovaNotaJoc();
          }, 500);
        } else {
          gameStreak = 0;
          streakVal.textContent = "0 🔥";
          gameFeedback.textContent = `Incorrecte! Era ${getFormattedNoteName(datosNotas[targetGameNote])}`;
          gameFeedback.className = "font-bold text-rose-400 text-right";
        }
      }

      // Event Handling (Mouse / Touch / Keyboard)
      tecles.forEach(t => {
        t.addEventListener('mousedown', (e) => { e.preventDefault(); reproduirNota(t); });
        t.addEventListener('mouseup', () => aturarNota(t));
        t.addEventListener('mouseleave', () => aturarNota(t));

        t.addEventListener('touchstart', (e) => { e.preventDefault(); reproduirNota(t); }, { passive: false });
        t.addEventListener('touchend', (e) => { e.preventDefault(); aturarNota(t); }, { passive: false });
        t.addEventListener('touchcancel', (e) => { e.preventDefault(); aturarNota(t); }, { passive: false });
      });

      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        const key = e.key.toLowerCase();
        if (mapaTeclat[key]) {
          reproduirNota(mapaTeclat[key]);
        }
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (mapaTeclat[key]) {
          aturarNota(mapaTeclat[key]);
        }
      });

      selectNotation.addEventListener('change', actualitzarEtiquetesTecles);

      sliderVolume.addEventListener('input', (e) => {
        if (masterGainNode && audioCtx) {
          masterGainNode.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
        }
      });

      btnFree.addEventListener('click', iniciarModeLliure);
      btnGame.addEventListener('click', iniciarModeJoc);

      actualitzarEtiquetesTecles();
    })();
  </script>
</body>
</html>
